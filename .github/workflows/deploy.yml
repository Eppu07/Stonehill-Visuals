name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pakottaa GitHub Actionsin sisäiset JS-ajurit Node 24:lle (Node 20 deprecated 6/2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          NODE_ENV: production
          DEPLOY_TARGET: github-pages
          # Supabase publishable key — turvallinen lähdekoodissa, RLS estää kaiken paitsi INSERTin
          NEXT_PUBLIC_SUPABASE_URL: https://wxqmaubxsqvbbezfzvta.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_vPetv91Nf6_YbcefIyTH-A_0eODdYuK

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
